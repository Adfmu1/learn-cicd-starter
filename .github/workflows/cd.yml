name: cd

on:
    push:
        branches: [main]

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: "1.26.0"

            - name: Build the app
              run: sh ./scripts/buildprod.sh

            - name: Authenticate to Google Cloud (Legacy JSON Key)
              uses: google-github-actions/auth@v2
              with:
                credentials_json: ${{ secrets.GCP_CREDENTIALS }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v3

            - name: Use gcloud CLI
              run: gcloud info

            - name: Build Docker image
              run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-497008/notely-ar-repo/notely-image:latest .